# Publishes the TODO app (src/todo-app/ — a static, no-build-step PWA per
# ADR 0004) to GitHub Pages, giving it a real HTTPS URL. HTTPS is required
# for the service worker to register and for reliable Home Screen
# installability on iOS (specs/todo-app/plan.md, specs/todo-app/spec.md).
name: Deploy TODO app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/todo-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: src/todo-app
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
