# Runs the todo-app's automated suite on every push/PR touching it — nothing
# did this before (code review finding, Task 15): security.yml's scanners
# and deploy-pages.yml's deploy don't run tests, so a regression could merge
# silently. security.yml's own header comment invites this: "add your
# test/lint jobs alongside these."
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/todo-app/**"
      - "tests/todo-app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/todo-app/**"
      - "tests/todo-app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  todo-app:
    name: TODO app test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:todo-app
