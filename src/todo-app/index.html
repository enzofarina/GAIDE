<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3a4a8a" />

  <!-- iOS Safari does not fully honor manifest.json for Home Screen installs
       — these are what actually get it to launch full-screen with no
       browser chrome, using its own Home Screen icon and title. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
</head>
<body>
  <main class="app">
    <h1>Tasks</h1>

    <div class="storage-error" data-testid="storage-error" role="alert" hidden></div>

    <form class="new-task-form" data-testid="new-task-form">
      <input
        type="text"
        name="text"
        data-testid="new-task-text"
        placeholder="Add a task…"
        aria-label="Task text"
        required
      />
      <input
        type="text"
        name="description"
        data-testid="new-task-description"
        placeholder="Description (optional)"
        aria-label="Task description (optional)"
      />
      <select name="urgency" data-testid="new-task-urgency" aria-label="Urgency">
        <option value="red">Urgent</option>
        <option value="yellow">Medium</option>
        <option value="green" selected>Chill</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <ul class="task-list" data-testid="task-list"></ul>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
