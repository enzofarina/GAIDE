<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAIDE — Feature Model navegável</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Newsreader:opsz,wght@6..72,300..600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#eef1f0;--surface:#f8faf9;--sunk:#e4e9e7;
  --ink:#12211f;--ink-soft:#3d4f4c;--muted:#5f716e;
  --line:#cbd5d2;--line-2:#a4b3b0;
  --accent:#0e5a5e;--accent-wash:#d9e6e5;
  --ok:#2e6b4b;--ok-wash:#d9ebe1;
  --warn:#8a6205;--warn-wash:#f3e7c9;
  --fail:#9c3a2e;--fail-wash:#f2ded9;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-b:"Newsreader",Georgia,serif;
  --f-m:"JetBrains Mono",Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1614;--surface:#18221f;--sunk:#101a18;
  --ink:#e5eae8;--ink-soft:#c2cecb;--muted:#8fa19d;
  --line:#2a3a37;--line-2:#41544f;
  --accent:#63c8c3;--accent-wash:#12312f;
  --ok:#6cbd8e;--ok-wash:#162c21;
  --warn:#dda743;--warn-wash:#2e2614;
  --fail:#e2796b;--fail-wash:#301b18;
}}
:root[data-theme="dark"]{
  --ground:#0e1614;--surface:#18221f;--sunk:#101a18;
  --ink:#e5eae8;--ink-soft:#c2cecb;--muted:#8fa19d;
  --line:#2a3a37;--line-2:#41544f;
  --accent:#63c8c3;--accent-wash:#12312f;
  --ok:#6cbd8e;--ok-wash:#162c21;
  --warn:#dda743;--warn-wash:#2e2614;
  --fail:#e2796b;--fail-wash:#301b18;
}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--ground);color:var(--ink);
     font-family:var(--f-d);-webkit-font-smoothing:antialiased}
.view{display:none}
.view.on{display:block}

/* ---------------- home ---------------- */
#home{height:100vh;padding:30px 34px 26px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-m);font-size:11px;font-weight:500;letter-spacing:.15em;
         text-transform:uppercase;color:var(--accent)}
h1{font-variation-settings:"wdth" 84;font-weight:700;font-size:clamp(1.5rem,2.6vw,2.2rem);
   line-height:1.02;letter-spacing:-.018em;margin:6px 0 0}
.hint{font-family:var(--f-m);font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
       border:1px solid var(--line);background:var(--surface);overflow:auto;padding:8px}
#stage>svg{display:block;width:100%;min-width:920px;max-width:2100px;height:auto}
#stage text{fill:var(--ink);font-family:var(--f-d);font-variation-settings:"wdth" 94;
            pointer-events:none}
.edge{stroke:var(--ink-soft);stroke-width:1.3;fill:none}
.arc-or{fill:var(--ink-soft);stroke:var(--ink-soft);stroke-width:1.2}
.arc-xor{fill:none;stroke:var(--ink-soft);stroke-width:1.4}
.mark-m{fill:var(--ink-soft);stroke:var(--ink-soft);stroke-width:1.2;pointer-events:none}
.mark-o{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.4;pointer-events:none}
.node{cursor:pointer}
.node rect{transition:fill .16s,stroke .16s}
.node:hover rect{fill:var(--accent-wash);stroke:var(--accent);stroke-width:2.4}
.node:focus{outline:none}
.node:focus-visible rect{stroke:var(--accent);stroke-width:3}
.nb{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.nb-root{fill:var(--sunk);stroke:var(--ink);stroke-width:2}
.s-ok{fill:var(--ok-wash);stroke:var(--ok);stroke-width:1.9}
.s-partial{fill:var(--warn-wash);stroke:var(--warn);stroke-width:1.9}
.s-fail{fill:var(--fail-wash);stroke:var(--fail);stroke-width:1.9}
.s-lie{fill:var(--fail-wash);stroke:var(--fail);stroke-width:2.6;stroke-dasharray:5 3}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--f-m);font-size:11px;
        color:var(--muted);line-height:1.5}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{height:15px;width:auto;flex:none}
.sw{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line-2);
    background:var(--surface);flex:none}
.toggle{display:flex;gap:6px}
.toggle button{font-family:var(--f-m);font-size:11px;letter-spacing:.03em;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:6px 11px;
    cursor:pointer}
.toggle button:hover{background:var(--sunk)}
.toggle button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------------- detalhe ---------------- */
#detail{padding:0 24px 90px}
.wrap{max-width:74ch;margin:0 auto}
.bar{position:sticky;top:0;background:var(--ground);padding:20px 0 16px;margin-bottom:8px;
     border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
     align-items:center;gap:16px;z-index:5}
.back{font-family:var(--f-m);font-size:12px;color:var(--accent);text-decoration:none;
      display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:3px;
      border:1px solid transparent}
.back:hover{background:var(--accent-wash);border-color:var(--accent)}
.crumb{font-family:var(--f-m);font-size:11px;color:var(--muted);flex:1}
.steps{display:flex;gap:5px;flex:none}
.steps button{font-family:var(--f-m);font-size:12px;line-height:1;padding:7px 11px;
    background:var(--surface);border:1px solid var(--line-2);border-radius:3px;
    color:var(--ink-soft);cursor:pointer}
.steps button:hover:not(:disabled){background:var(--accent-wash);border-color:var(--accent);
    color:var(--accent)}
.steps button:disabled{opacity:.35;cursor:default}
#body h2:focus{outline:none}
/* nó aberto no momento: mantém a orientação ao rolar de volta para o modelo */
.node.cur rect{stroke:var(--accent);stroke-width:3}
#detail h2{font-variation-settings:"wdth" 84;font-weight:700;
           font-size:clamp(2rem,4.4vw,3.1rem);line-height:1;letter-spacing:-.022em;
           margin:26px 0 14px;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px}
.badge{font-family:var(--f-m);font-size:10.5px;font-weight:500;letter-spacing:.07em;
       text-transform:uppercase;padding:4px 9px;border-radius:3px;background:var(--sunk);
       color:var(--ink-soft);white-space:nowrap}
.badge-ok{background:var(--ok-wash);color:var(--ok)}
.badge-part{background:var(--warn-wash);color:var(--warn)}
.badge-fail{background:var(--fail-wash);color:var(--fail)}
#detail h3{font-variation-settings:"wdth" 90;font-weight:700;font-size:.82rem;
           letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
           margin:34px 0 12px}
#detail p{font-family:var(--f-b);font-size:1.14rem;line-height:1.62;color:var(--ink-soft);
          margin:0 0 16px}
#detail p b,#detail p strong{color:var(--ink);font-weight:600}
.files{border:1px solid var(--line);background:var(--surface);display:grid}
.files div{display:grid;grid-template-columns:minmax(180px,auto) 1fr;gap:4px 20px;
           padding:12px 16px;border-bottom:1px solid var(--line);align-items:baseline}
.files div:last-child{border-bottom:none}
.files code{font-family:var(--f-m);font-size:12px;color:var(--ink);word-break:break-all}
.files span{font-size:.9rem;color:var(--muted);line-height:1.45;font-family:var(--f-d)}
.note{font-family:var(--f-m);font-size:11.5px;line-height:1.7;color:var(--muted);
      border-left:2px solid var(--line-2);padding-left:14px;margin:20px 0 0}
/* justificativa da tag de status — a borda repete a cor do badge no topo */
.estado{border:1px solid var(--line);border-left:4px solid var(--line-2);
        background:var(--surface);padding:20px 24px}
.estado.e-ok{border-left-color:var(--ok)}
.estado.e-partial{border-left-color:var(--warn)}
.estado.e-fail,.estado.e-lie{border-left-color:var(--fail)}
.estado p{margin:0;font-size:1.04rem}
.kids{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kids a{font-family:var(--f-m);font-size:11.5px;color:var(--ink-soft);text-decoration:none;
        background:var(--surface);border:1px solid var(--line-2);border-radius:3px;
        padding:7px 12px}
.kids a:hover{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.path{font-family:var(--f-m);font-size:.8em;background:var(--sunk);padding:1px 5px;
      border-radius:3px;color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:760px){#home{height:auto;min-height:100vh}#detail{padding:0 18px 70px}}
</style>
</head>
<body>

<section id="home">
  <div class="head">
    <div>
      <div class="eyebrow">GAIDE &middot; harness para agentes de c&oacute;digo</div>
      <h1>Feature model</h1>
    </div>
    <div class="hint">clique numa feature para abrir a p&aacute;gina dela<br>
      o que &eacute; &middot; por que existe &middot; onde est&aacute; no repo</div>
  </div>
  <div id="stage"></div>
  <div class="foot">
    <div class="legend" id="legend"></div>
    <div class="toggle" id="toggle">
      <button data-mode="estrutura" aria-pressed="true">Estrutura</button>
      <button data-mode="estado" aria-pressed="false">Estado atual</button>
    </div>
  </div>
</section>

<section id="detail" class="view">
  <div class="wrap">
    <div class="bar">
      <a class="back" href="#">&larr; feature model</a>
      <span class="crumb" id="crumb"></span>
      <span class="steps">
        <button id="prev" title="Feature anterior (seta esquerda)">&larr;</button>
        <button id="next" title="Pr&oacute;xima feature (seta direita)">&rarr;</button>
      </span>
    </div>
    <div id="body"></div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var T = [
    { id:'briefing', estado:"O arquivo existe, é lido por toda ferramenta e o import do Claude Code resolve. O que está incompleto é o conteúdo: <b>AGENTS.md ainda tem placeholders vazios</b> em linguagem, framework, banco, deploy, convenções de código e integrações. O agente lê o esqueleto do template, não este projeto. Parcial e não quebrado porque a metade que já está preenchida — protocolo de sessão, princípios obrigatórios, regras de chão — vale e é seguida.", label:['Briefing'], mark:'m', st:'partial',
      tipo:'obrigatório',
      what:'O documento que toda ferramenta lê ao abrir o projeto: stack, estrutura de pastas, protocolo de sessão, princípios obrigatórios e regras de chão.',
      why:'Sem um contrato único, cada ferramenta e cada sessão opera com um entendimento diferente do projeto, e o conhecimento sobre como as coisas funcionam aqui vira folclore de prompt — some junto com a janela de contexto. <b>AGENTS.md</b> é o padrão aberto que Cursor, Codex, Zed, Copilot e Gemini CLI leem nativamente; as demais ferramentas recebem por ponteiro.',
      files:[['AGENTS.md','o briefing canônico — é este que se edita'],
             ['.claude/CLAUDE.md','uma linha: importa o AGENTS.md'],
             ['.agents/rules/gaide.md','aponta o Antigravity para o AGENTS.md e resume os inegociáveis']],
       },

    { id:'constitution', estado:"Os dez princípios estão escritos e completos, incluindo a nota de expiração do harness. Não depende de binário, de instalação nem de ferramenta: é texto que qualquer agente lê ao abrir o projeto. Vale a ressalva de que este nó sozinho não <i>aplica</i> nada — os princípios 6, 9 e 10 só têm força porque outros nós do modelo os mecanizam.", label:['Constitution'], mark:'m', st:'ok',
      tipo:'obrigatório',
      what:'Dez princípios não-negociáveis, que só podem ser quebrados por um ADR explícito.',
      why:'Separa o que é estilo — negociável, discutível em review — do que é contrato. Os princípios <b>9</b> e <b>10</b> são os mais incomuns e os mais importantes aqui: proíbem apagar um teste ou silenciar um scanner para fazer o trabalho <i>parecer</i> pronto. É exatamente o comportamento que agentes longos exibem sob pressão de mostrar progresso, e o resto do harness existe para tornar esses dois princípios verificáveis.',
      files:[['specs/constitution.md','os dez princípios, cada um com o seu porquê']],
      note:'Traz também uma nota de expiração: o harness deve ser reexaminado a cada nova geração de modelo, porque over-scaffolding segura modelo bom.' },

    { id:'sdd', estado:"Os três templates e o exemplo preenchido estão no repositório e são utilizáveis como estão. A <span class=\"path\">example-feature</span> vem marcada como didática, então ninguém a confunde com uma spec real. A ressalva: <b>nenhum ciclo completo foi rodado neste repositório</b> — <span class=\"path\">src/</span> está vazio e <span class=\"path\">tests/</span> só tem README. O fluxo está pronto, mas nunca foi exercitado aqui.", label:['SDD'], mark:'m', st:'ok',
      tipo:'obrigatório',
      what:'Spec-Driven Development: spec, depois plano, depois tarefas, depois código — com portão humano em cada transição.',
      why:'Previne o drift entre o que a aplicação faz e o que as pessoas acreditam que ela faz. Duas peças fazem o trabalho pesado: o <b>sprint contract</b> no plano, que fixa o significado de "pronto" antes de a implementação começar, e o <b>ciclo de status</b> nas tarefas, onde <span class="path">done</span> e <span class="path">verified</span> são estados diferentes.',
      files:[['specs/template/spec.md','comportamento, critérios de aceite, considerações de segurança'],
             ['specs/template/plan.md','decisões, sequência e o sprint contract'],
             ['specs/template/tasks.md','tarefas atômicas e o ciclo pending → in-progress → done → verified'],
             ['specs/example-feature/','exemplo completo e preenchido, didático'],
             ['specs/README.md','como usar o fluxo']] },

    { id:'piso', estado:"Dos dois filhos, só a CI está comprovadamente ativa. O pre-commit foi instalado durante o setup e o hook do git existe, mas nunca foi exercitado num commit real. Enquanto isso, o piso vale de fato apenas na metade que roda no servidor — o que é justamente a metade mais lenta e mais tardia das duas.", label:['Piso git'], mark:'m', st:'partial',
      tipo:'obrigatório',
      what:'Os mesmos scanners de segurança rodando no nível do git, em vez de dentro da sessão de uma ferramenta.',
      why:'Hooks só existem dentro da IDE de quem os tem. Commit e push pegam <b>todo agente e todo humano</b>, independente de ferramenta, de disciplina e de quem lembrou de rodar o quê. É a única camada do harness que não depende de nada externo — e é por isso que ela é o piso, não o teto.',
      files:[['.pre-commit-config.yaml','gitleaks e semgrep antes de cada commit'],
             ['.github/workflows/security.yml','os três scanners e o drift check em push e PR']] },

    { id:'precommit', estado:"Instalado e presente: <span class=\"path\">pre-commit 4.6.2</span> responde, e o hook <span class=\"path\">.git/hooks/pre-commit</span> existe. O que falta é prova de execução: nenhum commit passou por ele ainda. E há um risco concreto e nomeado — <b>este hook chama o mesmo gitleaks que já falha em silêncio no portão de fim de turno</b>. Até rodar um commit de teste com um segredo falso, o correto é dizer instalado, não funcionando.", label:['pre-commit'], mark:'m', st:'partial', parent:'piso',
      tipo:'obrigatório dentro do piso git',
      what:'Roda gitleaks e semgrep automaticamente antes de cada commit, na máquina de quem commita.',
      why:'Estende o mesmo scanner ao humano que commita à mão e ao agente cuja ferramenta não tem eventos de hook. É o primeiro portão mecânico para todo mundo que não está no Claude Code.',
      files:[['.pre-commit-config.yaml','os hooks e as versões fixadas'],
             ['.git/hooks/pre-commit','gerado por "pre-commit install" — não versionado']],
       },

    { id:'ci', estado:"O workflow está versionado, com as actions fixadas por SHA de commit, e o remote do GitHub está configurado. Os quatro jobs disparam em push para a main e em qualquer PR. É hoje a <b>única camada onde os três scanners rodam de ponta a ponta</b>, e não por acaso: roda num Ubuntu onde nem o problema do <span class=\"path\">python3</span> nem o do CRLF existem. A proteção real deste repositório começa aqui.", label:['CI'], mark:'m', st:'ok', parent:'piso',
      tipo:'obrigatório dentro do piso git',
      what:'GitHub Actions rodando gitleaks, semgrep e osv-scanner em todo push e PR, mais uma checagem de drift dos bindings gerados.',
      why:'É o último portão e o único que ninguém consegue pular localmente. O drift check tem um papel próprio: garante que ninguém editou um arquivo gerado em vez da fonte portátil, o que faria a política divergir silenciosamente entre ferramentas.',
      files:[['.github/workflows/security.yml','quatro jobs: secrets, SAST, dependências, drift']],
       },

    { id:'inline', estado:"Depois do setup, quatro dos cinco portões funcionam: segredos, sintaxe, SAST e SCA. O quinto, fim de turno, está instalado e não detecta. A camada não pode ser chamada de funcionando porque <b>um portão que reporta sucesso falso é pior que um portão ausente</b> — o ausente você sabe que não tem, o falso você acredita que tem.", label:['Enforcement','inline'], mark:'o', st:'partial', dep:'Claude Code',
      tipo:'opcional',
      what:'Hooks que interceptam a tool call do agente no momento em que ela acontece, e podem rejeitá-la.',
      why:'É a materialização da tese do projeto. Uma regra escrita em prosa é ignorável sob pressão de contexto; um <span class="path">exit 2</span> que rejeita a escrita não é. E o feedback chega com o contexto ainda quente: corrigir no momento da edição custa segundos, corrigir no commit custa um ciclo inteiro depois de outros arquivos terem sido construídos em cima.',
      files:[['.claude/settings.json','a fiação: qual evento dispara qual script, e as permissões negadas'],
             ['.claude/hooks/','quatro adaptadores finos, ~5 linhas cada'],
             ['scripts/','a lógica real das checagens, em shell portátil']],
      note:'Só existe onde a ferramenta tem eventos de hook — hoje, Claude Code. Nas demais, as mesmas checagens existem em scripts/ mas dependem de o agente lembrar de rodá-las.' },

    { id:'segredos', estado:"Verificado nos dois sentidos, não só na instalação. Conteúdo inofensivo passa com exit 0; uma chave AWS de teste é bloqueada com exit 1 e a mensagem do Princípio 6. O tratamento de placeholder também foi confirmado: <span class=\"path\">AKIAIOSFODNN7EXAMPLE</span> passa de propósito, porque contém a palavra EXAMPLE. Só voltou a funcionar depois do shim de <span class=\"path\">python3</span> em <span class=\"path\">~/bin</span> — antes disso ele falhava fechado e bloqueava toda escrita no repositório.", label:['Segredos'], mark:'o', st:'ok', parent:'inline', dep:'python3 + shell POSIX',
      tipo:'opcional', evento:'PreToolUse — antes da escrita',
      what:'Varre o conteúdo de todo Write e Edit contra padrões conhecidos de segredo, antes de a escrita acontecer. Se casar, a tool call é rejeitada.',
      why:'Segredo em commit vive para sempre no histórico do git, mesmo depois de removido — é o vetor de incidente mais comum em times que adotam vibe coding sem disciplina (Princípio 6). Este é o único portão que age <i>antes</i> do dano, não depois. Placeholders como <span class="path">YOUR_</span>, <span class="path">EXAMPLE</span> e <span class="path">CHANGE_ME</span> passam de propósito, para que arquivos <span class="path">.env.example</span> continuem possíveis.',
      files:[['scripts/check-secrets.sh','a checagem: sete padrões de segredo, em Python puro'],
             ['.claude/hooks/block-secrets.sh','adaptador: extrai o conteúdo do payload e traduz falha em exit 2']] },

    { id:'sintaxe', estado:"Os três ramos respondem. JSON válido passa; JSON quebrado é rejeitado apontando linha e coluna do erro. O ramo <span class=\"path\">.sh</span> usa <span class=\"path\">bash -n</span> e nunca dependeu de Python — era o único que funcionava antes do shim. Continua sendo uma checagem deliberadamente rasa: cobre três extensões e nada além.", label:['Sintaxe'], mark:'o', st:'ok', parent:'inline', dep:'python3 + shell POSIX',
      tipo:'opcional', evento:'PostToolUse — depois da escrita',
      what:'Checagem rápida por arquivo logo após cada edição: shell, JSON e Python.',
      why:'Erro de sintaxe descoberto na revisão custa um ciclo inteiro; descoberto dois segundos depois da edição custa nada. É deliberadamente barato e superficial — a suíte completa é responsabilidade do bootstrap de sessão, não de cada tecla.',
      files:[['scripts/check-file.sh','um case por extensão; a ideia é estender por stack'],
             ['.claude/hooks/check-edited-file.sh','adaptador: extrai o file_path do payload']] },

    { id:'sast', estado:"<span class=\"path\">semgrep 1.175.0</span> instalado via pip, rodando em Windows nativo, sem WSL. Testado com um caso conhecido — <span class=\"path\">subprocess.call(cmd, shell=True)</span> — e classificado como Blocking, com link da regra e sugestão de correção. Uma ressalva para o futuro: <b>Windows não é plataforma oficialmente suportada pelo semgrep</b>. Funciona hoje, mas não é um caminho garantido nas próximas versões.", label:['SAST'], mark:'o', st:'ok', parent:'inline', dep:'semgrep',
      tipo:'opcional', evento:'PostToolUse — depois da escrita',
      what:'Roda o semgrep no arquivo recém-editado, com os rulesets de auditoria de segurança e de segredos.',
      why:'O achado volta para o agente com o contexto ainda fresco, que é quando corrigir é barato. E o Princípio 10 fecha a saída fácil: achado é corrigido ou a dependência é atualizada, nunca silenciado — supressão só vale em commit dedicado que explique por que é falso positivo. O desenho do script reforça isso: <b>achado bloqueia, erro de ferramenta nunca bloqueia</b>.',
      files:[['scripts/check-security.sh:31','o ramo SAST e a semântica de exit code'],
             ['.claude/hooks/check-security.sh','adaptador']] },

    { id:'sca', estado:"<span class=\"path\">osv-scanner 2.4.0</span> instalado e respondendo. Mas o comportamento de ponta a ponta <b>nunca foi exercitado neste repositório</b>, e não por descuido: o ramo SCA só dispara quando o arquivo editado é lockfile ou manifesto, e o projeto ainda não tem nenhum. Rodar o scanner na raiz confirma: nenhuma fonte de pacote encontrada. Pelo mesmo critério aplicado ao pre-commit, este nó está mais para instalado do que para comprovado.", label:['SCA'], mark:'o', st:'ok', parent:'inline', dep:'osv-scanner',
      tipo:'opcional', evento:'PostToolUse — depois da escrita',
      what:'Quando o arquivo editado é um lockfile ou manifesto de dependências, roda o osv-scanner contra a base de vulnerabilidades conhecidas.',
      why:'Dependência vulnerável é a via de entrada mais silenciosa que existe, e agentes têm o hábito de alucinar nomes de pacote — inclusive nomes parecidos com pacotes reais. Pegar no instante em que a dependência entra é muito mais barato do que descobrir num inventário trimestral.',
      files:[['scripts/check-security.sh:17','a lista de lockfiles reconhecidos e o ramo SCA']] },

    { id:'turno', estado:"Este é o achado mais sério do levantamento, e tem <b>duas causas independentes</b>, ambas reproduzidas.<br><br><b>1. Aviso de CRLF envenena o stderr.</b> Com um segredo falso num arquivo rastreado, o gitleaks leu os 32 bytes do diff e respondeu: <span class=\"path\">ERR error=&quot;stderr is not empty&quot;</span> seguido de <span class=\"path\">no leaks found</span> e exit 0. O aviso do Git (<i>LF will be replaced by CRLF</i>) é tratado como erro, a varredura aborta — e o resultado reportado é sucesso.<br><br><b>2. Arquivo não rastreado não é varrido.</b> O modo <span class=\"path\">protect</span> olha apenas o diff de arquivos já rastreados. Um segredo em arquivo novo passa direto, mesmo sem o problema do CRLF.<br><br>O binário está sadio: <span class=\"path\">gitleaks detect --no-git</span> no mesmo arquivo acusa <span class=\"path\">leaks found: 1</span>. Ou seja, a ferramenta funciona e o portão não — que é exatamente por que a tag não é “não funciona”, e sim <b>instalado, mas não detecta</b>. Um portão inerte é um risco conhecido; um portão que responde “tudo limpo” sem ter olhado é um risco invisível.", label:['Fim de turno'], mark:'o', st:'lie', parent:'inline',
      tipo:'opcional', evento:'Stop — antes de o agente encerrar',
      what:'Antes de o agente terminar o turno com mudanças não commitadas, verifica duas coisas: que não há segredos no diff e que a suíte de testes passa.',
      why:'Impede encerrar a sessão deixando a árvore quebrada para a próxima — o mesmo modo de falha que o bootstrap depois tenta detectar do outro lado. É o Princípio 8 aplicado à própria sessão: falhar visivelmente em vez de silenciosamente. Tem uma guarda anti-loop: se o hook já disparou para este mesmo encerramento, deixa passar, porque o agente já viu a falha e reportou.',
      files:[['scripts/check-clean-state.sh:16','a varredura de segredos e a suíte de testes'],
             ['.claude/hooks/check-before-stop.sh','adaptador, com a guarda stop_hook_active']],
       },

    { id:'turno-segredos', label:['Segredos'], mark:'m', st:'lie', parent:'turno', dep:'gitleaks',
      tipo:'obrigatório dentro do fim de turno',
      what:'Varre as mudanças não commitadas em busca de segredos, com o gitleaks em modo git-aware.',
      why:'É a segunda rede do Princípio 6, e não uma redundância do portão de edição. Aquele vê só o que passa por Write e Edit; este vê o que <b>entrou por outro caminho</b> — comando de shell, redirecionamento, arquivo colado à mão. E é mais fundo: ruleset completo e detecção por entropia, em vez dos sete padrões do regex.',
      files:[['scripts/check-clean-state.sh:15','o bloco do gitleaks, condicional à instalação']],
      estado:"Esta é a metade quebrada do portão, e a razão da tag no pai. Com um segredo falso num arquivo rastreado, o gitleaks leu os 32 bytes do diff e respondeu <span class=\"path\">ERR error=&quot;stderr is not empty&quot;</span> seguido de <span class=\"path\">no leaks found</span> e exit 0 — o aviso de CRLF do Git é tratado como erro, a varredura aborta e o resultado reportado é sucesso. Some a isso que o modo <span class=\"path\">protect</span> só olha arquivos já rastreados, então segredo em arquivo novo passa direto mesmo sem o CRLF. O binário está sadio: <span class=\"path\">gitleaks detect --no-git</span> no mesmo arquivo acusa <span class=\"path\">leaks found: 1</span>." },

    { id:'turno-testes', label:['Testes'], mark:'m', st:'fail', parent:'turno',
      tipo:'obrigatório dentro do fim de turno',
      what:'Roda a suíte de testes do projeto — <span class="path">npm test</span> ou <span class="path">pytest</span>, conforme o que o repositório tiver — antes de o agente encerrar.',
      why:'Impede encerrar o turno deixando a árvore vermelha para a próxima sessão. Cruza dois princípios: o 8, falhar visivelmente em vez de silenciosamente, e o 9, que trata o teste como registro externo de verdade. Um agente que termina com a suíte quebrada e não avisa transfere o problema para quem não sabe que ele existe.',
      files:[['scripts/check-clean-state.sh:23','a cadeia npm test / pytest, com exit 5 aceito quando não há teste coletado']],
      estado:"Inerte hoje, e não por defeito do script: <b>não há runner instalado nem manifesto de dependências</b> no repositório. A cadeia <span class=\"path\">if/elif</span> não casa com nada e o script segue para o exit 0. É consequência de o template ainda não ter stack — <span class=\"path\">src/</span> vazio, <span class=\"path\">tests/</span> só com README. Assim que o projeto ganhar um <span class=\"path\">package.json</span> ou <span class=\"path\">pyproject.toml</span> com testes, esta metade acorda sozinha." },

    { id:'binding', estado:"Os bindings estão gerados e em dia. A mesma skill vive em três arquivos e o diff entre a fonte e cada gerado são as duas linhas do marcador GENERATED — nada divergiu. O <span class=\"path\">--check</span> do script de sync existe justamente para a CI barrar quem editar o gerado em vez da fonte.", label:['Binding'], mark:'o', group:'or', st:'ok',
      tipo:'opcional · grupo or (um ou mais)',
      what:'A tradução da política portátil para o dialeto de cada ferramenta. Contém formato, não conteúdo.',
      why:'Cada ferramenta agentiva tem convenção própria e incompatível para quatro coisas: onde busca o briefing, como registra um procedimento, qual o protocolo de hook e como declara permissões. Isolar isso num binding gerado mantém a política canônica num lugar só e torna a troca de ferramenta barata — algumas dezenas de linhas, não a reescrita de specs e skills. <b>Ausência de binding é uma opção válida:</b> o AGENTS.md sozinho já é lido nativamente por Cursor, Codex, Zed, Copilot e Gemini CLI.',
      files:[['scripts/sync-adapters.sh','gera os bindings a partir das fontes; --check detecta drift na CI'],

      note:'A mesma skill vive em três arquivos, e o diff entre a fonte e o gerado são duas linhas de comentário. Só o caminho muda, porque só o lugar onde cada ferramenta olha muda.' },

    { id:'cc', estado:"É o binding em uso nesta máquina, e o único que entrega enforcement no momento da edição. Permissões, fiação de hooks, skills e subagentes estão todos presentes e carregando. Toda a coluna de enforcement inline do modelo depende dele — trocar de ferramenta hoje significa descer para o piso git.", label:['Claude Code'], parent:'binding', st:'ok',
      tipo:'membro de grupo or',

      why:'É a única ferramenta com eventos de hook capazes de rejeitar uma tool call, além de permissões declarativas e subagentes de contexto limpo. Por isso toda a coluna de enforcement inline depende dele — e por isso a limitação de cobertura do harness é, na prática, uma limitação de ferramenta.',
      files:[['.claude/settings.json','permissões e fiação dos hooks — escrito à mão'],

    { id:'ag', label:['Antigravity'], parent:'binding',

      files:[['.agents/rules/gaide.md','aponta para o AGENTS.md e lista os inegociáveis'],

    { id:'skills', estado:"As seis skills e as duas rubricas de revisão estão escritas e sincronizadas para os dois bindings. São Markdown puro, então não dependem de instalação nenhuma. O que não dá para afirmar é eficácia: <b>nenhuma foi exercitada num ciclo real neste repositório</b>, então não há evidência de que a revisão em contexto limpo encontre o que o implementador não viu.", label:['Skills'], mark:'m', st:'ok',
      tipo:'obrigatório',
      what:'Procedimentos de agente escritos uma vez em Markdown, invocáveis por nome.',

    { id:'verifier', estado:"A skill está escrita e completa, mas o caminho que ela precisa está fechado: o servidor <b>Playwright segue desabilitado</b> pelo prefixo <span class=\"path\">_</span> em <span class=\"path\">.mcp.json:31</span>, que é a convenção do template para servidor opcional. Sem ele, não há como dirigir a aplicação pelo navegador — e como este é o único caminho para o status <span class=\"path\">verified</span>, <b>nenhum critério de interface consegue sair de done hoje</b>. Habilitar é remover o underscore e conectar o servidor.", label:['verifier'], mark:'o', st:'fail', parent:'skills', dep:'Playwright MCP',
      tipo:'opcional',

    { id:'outras', estado:"As cinco estão escritas, sincronizadas e invocáveis por nome nos dois bindings. A rubrica de revisão em contexto limpo está completa, incluindo a auditoria de supressões que torna o Princípio 10 verificável. Mesma ressalva das skills em geral: disponível não é o mesmo que comprovado — falta rodar um ciclo real.", label:['outras 5 skills'], mark:'o', st:'ok', parent:'skills',
      tipo:'opcional',
      what:'spec-writer, code-reviewer, security-reviewer, adr-writer e test-generator.',
      why:'A mais interessante é a <b>code-reviewer</b>: ela roda em contexto limpo e recebe apenas o diff e os caminhos dos documentos, nunca a conversa de implementação. O motivo é preciso — o contexto que escreveu o bug contém as racionalizações que o produziram. É o que corrige o problema clássico de pedir ao agente que revise o próprio código, onde ele concorda consigo mesmo. A <b>security-reviewer</b> acrescenta a auditoria de supressões: qualquer nosemgrep ou ignore novo fora de commit dedicado é blocker automático.',

    { id:'autonomia', estado:"O modo em vigor está declarado em dois lugares e eles concordam entre si: o Princípio 3 da constitution e a seção de operação do AGENTS.md. A regra de migração — mudar de modo exige ADR — está escrita. Vale notar que este nó é <b>governança, não mecanismo</b>: nada no repositório impede tecnicamente alguém de operar em outro modo, o que segura é a revisão humana antes do commit.", label:['Autonomia'], mark:'m', group:'xor', st:'ok',

  var ROOT = { id:'root', label:['GAIDE'], root:1,
    tipo:'raiz',
    what:'Um template de projeto que não traz código de aplicação nenhum — <span class="path">src/</span> é vazio por design. O que ele traz é a camada de ambiente em volta do agente: o que ele lê antes de agir, o que é bloqueado quando ele erra, e o que sobra em disco quando a janela de contexto morre.',
    why:'Vibe coding falha de formas nomeáveis e reproduzíveis: o conhecimento mora no prompt e morre com a janela; "pronto" passa a significar "escrevi código"; o agente revisa o próprio código e concorda consigo mesmo; sob pressão de mostrar progresso, ele apaga o teste em vez de corrigir o bug. A tese do projeto é que <b>nenhuma dessas falhas se resolve com prompt melhor</b> — instruções degradam sob pressão de contexto, mecanismos não.',
    files:[['AGENTS.md','o briefing canônico'],
           ['README.md','o que o template entrega e por quê'],
           ['specs/constitution.md','os dez princípios']] };

  /* ---------------- layout ---------------- */
  var NW = 84, NH = 36, RW = 104, GW = 8, GG = 26, PAD = 22;
  var LY = [14, 102, 200, 292]; /* y por nível: raiz, topo, filhos, netos */

  var TOP = [], BY = {}, ALL = [ROOT];
  BY.root = ROOT;
  T.forEach(function (n) { BY[n.id] = n; ALL.push(n); });
  T.forEach(function (n) {
    if (!n.parent) { TOP.push(n); return; }
    var p = BY[n.parent];
    (p.kids = p.kids || []).push(n);
  });
  ROOT.kids = TOP;

  /* Layout recursivo: cada nó é centrado sobre a largura da própria subárvore,
     então acrescentar netos alarga o ramo em vez de sobrepor os vizinhos. */
  function layout(n, depth, x) {
    n.y = LY[depth];
    var kids = n.kids || [];
    if (!kids.length) { n.x = x; return NW; }
    var gap = depth === 0 ? GG : GW;
    var cx = x;
    kids.forEach(function (k, i) {
      if (i) cx += gap;
      cx += layout(k, depth + 1, cx);
    });
    var total = cx - x, self = n.root ? RW : NW;
    n.x = x + Math.max(0, total - self) / 2;
    return Math.max(total, self);
  }

  function walk(n, fn) {
    fn(n);
    (n.kids || []).forEach(function (k) { walk(k, fn); });
  }

  var W = layout(ROOT, 0, PAD) + PAD * 2;
  var maxD = 0;
  walk(ROOT, function (n) { maxD = Math.max(maxD, LY.indexOf(n.y)); });
  var H = LY[maxD] + NH + PAD;

  /* ---------------- desenho ---------------- */
  function esc(s) { return String(s).split('&').join('&amp;').split('<').join('&lt;'); }

  function node(n) {
    var w = n.root ? RW : NW, cx = n.x + w / 2;
    var fs = n.root ? 12.5 : 10.8, fw = n.root ? 700 : 500;
    var s = '<g class="node" data-id="' + n.id + '" tabindex="0" role="link" ' +
            'aria-label="Abrir ' + esc(n.label.join(' ')) + '">' +
            '<rect x="' + n.x + '" y="' + n.y + '" width="' + w + '" height="' + NH +
            '" rx="9" class="nb"/>';
    function t(txt, dy) {
      return '<text x="' + cx + '" y="' + (n.y + NH / 2 + dy) + '" text-anchor="middle" font-size="' +
             fs + '" font-weight="' + fw + '">' + esc(txt) + '</text>';
    }
    s += n.label.length === 1 ? t(n.label[0], 3.8) : t(n.label[0], -2.5) + t(n.label[1], 9.8);
    return s + '</g>';
  }

  function edge(p, c, pw) {
    return '<path class="edge" d="M' + (p.x + pw / 2) + ',' + (p.y + NH) +
           ' L' + (c.x + NW / 2) + ',' + c.y + '"/>';
  }

  function mark(c) {
    if (!c.mark) return '';
    return '<circle cx="' + (c.x + NW / 2) + '" cy="' + c.y + '" r="4.5" class="' +
           (c.mark === 'm' ? 'mark-m' : 'mark-o') + '"/>';
  }

  function arc(p) {
    if (!p.group || !p.kids) return '';
    var px = p.x + NW / 2, py = p.y + NH, r = 21, k = p.kids;
    function pt(c) {
      var dx = (c.x + NW / 2) - px, dy = c.y - py, m = Math.sqrt(dx * dx + dy * dy);
      return [(px + dx / m * r).toFixed(2), (py + dy / m * r).toFixed(2)];
    }
    var a = pt(k[0]), b = pt(k[k.length - 1]);
    if (p.group === 'or') {
      return '<path class="arc-or" d="M' + px + ',' + py + ' L' + a[0] + ',' + a[1] +
             ' A' + r + ',' + r + ' 0 0,1 ' + b[0] + ',' + b[1] + ' Z"/>';
    }
    return '<path class="arc-xor" d="M' + a[0] + ',' + a[1] + ' A' + r + ',' + r +
           ' 0 0,1 ' + b[0] + ',' + b[1] + '"/>';
  }

  var edges = '', arcs = '', nodes = '', marks = '';
  walk(ROOT, function (n) {
    var pw = n.root ? RW : NW;
    (n.kids || []).forEach(function (k) { edges += edge(n, k, pw); });
    arcs += arc(n);
    nodes += node(n);
    marks += mark(n);
  });

  var stage = document.getElementById('stage');
  stage.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
                    'aria-label="Feature model do GAIDE">' +
                    edges + arcs + nodes + marks + '</svg>';

  /* ---------------- modos ---------------- */
  var LEG_STRUCT =
    '<span><svg width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="currentColor"/></svg> obrigatório</span>' +
    '<span><svg width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg> opcional</span>' +
    '<span><svg width="20" height="16"><path d="M3 13 A 9 9 0 0 1 17 13 L 10 4 Z" fill="currentColor"/></svg> grupo or</span>' +
    '<span><svg width="20" height="16"><path d="M3 13 A 9 9 0 0 1 17 13" fill="none" stroke="currentColor" stroke-width="1.4"/></svg> grupo xor</span>';

  var LEG_STATE =
    '<span><span class="sw" style="background:var(--ok-wash);border-color:var(--ok)"></span> funcionando</span>' +
    '<span><span class="sw" style="background:var(--warn-wash);border-color:var(--warn)"></span> parcial</span>' +
    '<span><span class="sw" style="background:var(--fail-wash);border-color:var(--fail)"></span> não funciona</span>' +
    '<span><span class="sw" style="background:var(--fail-wash);border-color:var(--fail);border-style:dashed;border-width:2px"></span> instalado, mas não detecta</span>';

  function setMode(m) {
    var gs = stage.querySelectorAll('.node');
    for (var i = 0; i < gs.length; i++) {
      var n = BY[gs[i].getAttribute('data-id')];
      var c = n.root ? 'nb-root' : (m === 'estado' && n.st ? 's-' + n.st : 'nb');
      gs[i].querySelector('rect').setAttribute('class', c);
    }
    document.getElementById('legend').innerHTML = m === 'estado' ? LEG_STATE : LEG_STRUCT;
    var bs = document.querySelectorAll('#toggle button');
    for (var j = 0; j < bs.length; j++) {
      bs[j].setAttribute('aria-pressed', bs[j].getAttribute('data-mode') === m ? 'true' : 'false');
    }
  }

  document.getElementById('toggle').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (b) setMode(b.getAttribute('data-mode'));
  });

  /* ---------------- páginas de feature ---------------- */
  var ST_LABEL = { ok:['funcionando', 'badge-ok'], partial:['parcial', 'badge-part'],
                   fail:['não funciona', 'badge-fail'], lie:['instalado, mas não detecta', 'badge-fail'] };

  function render(n) {
    var h = '<h2 tabindex="-1">' + esc(n.label.join(' ')) + '</h2><div class="badges">';
    if (n.tipo) h += '<span class="badge">' + esc(n.tipo) + '</span>';
    if (n.evento) h += '<span class="badge">' + esc(n.evento) + '</span>';
    if (n.st && ST_LABEL[n.st]) {
      h += '<span class="badge ' + ST_LABEL[n.st][1] + '">' + ST_LABEL[n.st][0] + '</span>';
    }
    h += '</div>';

    h += '<h3>O que é</h3><p>' + n.what + '</p>';
    h += '<h3>Por que existe</h3><p>' + n.why + '</p>';

    h += '<h3>Onde está no repositório</h3><div class="files">';
    (n.files || []).forEach(function (f) {
      h += '<div><code>' + esc(f[0]) + '</code><span>' + esc(f[1]) + '</span></div>';
    });
    h += '</div>';

    if (n.kids && n.kids.length) {
      h += '<h3>Contém</h3><div class="kids">';
      n.kids.forEach(function (k) {
        h += '<a href="#f/' + k.id + '">' + esc(k.label.join(' ')) + '</a>';
      });
      h += '</div>';
    }

    /* Dependência é informação, não destino — badge estático, nunca um link falso:
       com a aparência de chip clicável de "Contém", viraria alvo de foco morto. */
    if (n.dep) {
      h += '<h3>Depende de</h3><div class="badges"><span class="badge">' +
           esc(n.dep) + '</span></div>';
    }

    if (n.note) h += '<p class="note">' + esc(n.note) + '</p>';

    /* Fecha a página justificando a tag de status que aparece lá em cima. */
    if (n.estado && n.st) {
      var t = n.st === 'ok' ? 'Como está funcionando hoje'
            : n.st === 'partial' ? 'Por que está parcial'
            : n.st === 'lie' ? 'Por que a tag é essa'
            : 'Por que não funciona';
      h += '<h3>' + t + '</h3><div class="estado e-' + n.st + '"><p>' + n.estado + '</p></div>';
    }
    return h;
  }

  /* ---------------- navegação ----------------
     A troca de view é feita direto por show(), sem depender do hash: em algumas
     origens (data:, sandbox) escrever em location.hash não dispara hashchange.
     O hash continua sendo atualizado quando dá, para o botão voltar do navegador
     e para links diretos funcionarem onde a origem permite. */
  var detail = document.getElementById('detail');
  var elPrev = document.getElementById('prev'), elNext = document.getElementById('next');

  var REDUCED = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = REDUCED ? 'auto' : 'smooth';

  /* Ordem de leitura do diagrama: raiz, depois cada feature de topo seguida
     dos seus filhos, da esquerda para a direita. É a ordem que as setas seguem. */
  var ORDER = [];
  walk(ROOT, function (n) { ORDER.push(n.id); });

  var curId = '';

  function markCurrent(id) {
    curId = id || '';
    var gs = stage.querySelectorAll('.node');
    for (var i = 0; i < gs.length; i++) {
      gs[i].classList.toggle('cur', gs[i].getAttribute('data-id') === curId);
    }
    var at = ORDER.indexOf(curId);
    elPrev.disabled = at <= 0;
    elNext.disabled = at < 0 || at >= ORDER.length - 1;
  }

  /* O modelo fica sempre visível no topo; a página da feature abre logo abaixo
     e a view rola até ela. Voltar rola de volta para o modelo. */
  function show(id, quiet) {
    var n = BY[id];
    markCurrent(n ? id : '');
    if (n) {
      document.getElementById('body').innerHTML = render(n);
      document.getElementById('crumb').textContent =
        n.parent ? BY[n.parent].label.join(' ') + ' / ' + n.label.join(' ') : n.label.join(' ');
      detail.classList.add('on');
      if (quiet) return;
      try { detail.scrollIntoView({ behavior: EASE, block: 'start' }); }
      catch (err) { detail.scrollIntoView(true); }
      /* leitor de tela e teclado seguem para o conteúdo que acabou de abrir */
      var t = document.querySelector('#body h2');
      if (t && t.focus) { try { t.focus({ preventScroll: true }); } catch (err) { t.focus(); } }
    } else {
      detail.classList.remove('on');
      if (quiet) return;
      try { window.scrollTo({ top: 0, behavior: EASE }); }
      catch (err) { window.scrollTo(0, 0); }
    }
  }

  function step(delta) {
    var at = ORDER.indexOf(curId);
    if (at < 0) return;
    var to = at + delta;
    if (to < 0 || to >= ORDER.length) return;
    nav(ORDER[to]);
  }

  function nav(id) {
    show(id);
    /* pushState não recarrega; escrever em location.hash recarrega em algumas
       origens (data:, sandbox) e perderia a view recém-aberta. Onde pushState
       não é permitido, a navegação segue funcionando sem URL. */
    try { history.pushState({ id: id || '' }, '', id ? '#f/' + id : '#'); } catch (err) { /* sem URL */ }
  }

  function fromUrl(initial) {
    var h = '';
    try { h = window.location.hash || ''; } catch (err) { return; }
    var id = h.indexOf('#f/') === 0 ? h.slice(3) : '';
    show(id, initial);
    /* link direto aberto do zero: posiciona sem animar */
    if (initial && BY[id]) { try { detail.scrollIntoView(true); } catch (err) { /* noop */ } }
  }

  stage.addEventListener('click', function (e) {
    var g = e.target.closest ? e.target.closest('.node') : null;
    if (g) nav(g.getAttribute('data-id'));
  });

  stage.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var g = e.target.closest ? e.target.closest('.node') : null;
    if (g) { e.preventDefault(); nav(g.getAttribute('data-id')); }
  });

  detail.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.indexOf('#f/') === 0) { e.preventDefault(); nav(href.slice(3)); }
    else if (a.classList.contains('back')) { e.preventDefault(); nav(''); }
  });

  elPrev.addEventListener('click', function () { step(-1); });
  elNext.addEventListener('click', function () { step(1); });

  window.addEventListener('keydown', function (e) {
    if (!detail.classList.contains('on')) return;
    if (e.key === 'Escape') { nav(''); return; }
    /* setas só andam entre features quando o campo não é de digitação */
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });

  window.addEventListener('popstate', function (e) {
    if (e.state && typeof e.state.id === 'string') show(e.state.id);
    else fromUrl();
  });

  setMode('estrutura');
  fromUrl(true);
})();
</script>
</body>
</html>
